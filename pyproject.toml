[project]
name = "kleys"
version = "0.2.0"
description = "Execute commands with secrets loaded encrypted from your system keyring"
readme = "README.md"
authors = [
    { name = "Hugo Batista <code at hugobatista.com>" },
]
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }

dependencies = [
    "typer>=0.27",
    "keyring>=25.7",
    "cryptography>=50.0",
]

[dependency-groups]
lint = [
    "mypy>=2.4",
    "ruff>=0.17",
]
test = [
    "pytest>=9.1",
    "pytest-mock>=3.17",
    "pytest-cov>=7.1",
]
dev = [
    "hatch>=1.18",
    {include-group = "lint"},
    {include-group = "test"},
]

[project.scripts]
kleys = "kleys.cli:main"

[tool.uv]
required-version = ">=0.11.18"
exclude-newer = "30 days"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kleys"]

[tool.hatch.envs.default]
type = "virtual"
path = ".venv"

[tool.hatch.envs.default.scripts]
lint = "ruff check . --fix"
format = "ruff format ."
lint-check = "ruff check ."
format-check = "ruff format --check ."
test = "pytest"
typecheck = "mypy"
validate = ["lint", "format", "test", "typecheck"]
check = ["lint-check", "format-check", "test", "typecheck"]

[tool.pytest.ini_options]
addopts = "--tb=short --strict-markers --cov --cov-report=term-missing"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/kleys"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
strict = true
incremental = false
check_untyped_defs = true
files = ["src"]
exclude = ["tests/"]

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
